<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <title>Mineradio Edge Rail</title>
  <style>
    :root {
      --t: 6px;
      /* 窗口往屏幕外推的量，条子按同样的量内缩回屏幕边界（见 mini-player-runtime RAIL.bleed） */
      --bleed: 2px;
      /* 默认色只是兜底，运行时会换成主窗口"音域方块"正在用的那组颜色 */
      --c-cool: #33e6ff;
      --c-warm: #ffd070;
      --c-accent: #7fd8ff;
      --ink: #E8ECEF;
      --font-mono: "JetBrains Mono", "SF Mono", ui-monospace, monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
    }

    /* 整个窗口是命中区（保持透明）；真正画出来的只有贴屏幕最外沿的 #bar，宽 = --t。
       窗口横截面被 Windows 夹到 ~36px 且整体往屏幕外多推 --bleed，所以条子内缩
       --bleed 对齐到真实屏幕边界——只靠 right:0 在 150% 缩放下会因取整留一条桌面缝。 */
    #hit { position: absolute; inset: 0; }

    #bar {
      position: absolute;
      top: 0;
      bottom: 0;
      right: var(--bleed);
      width: var(--t);
      background: rgba(232, 236, 239, .13);
      transition: background .16s ease;
    }

    body[data-edge="left"] #bar { right: auto; left: var(--bleed); }
    body[data-edge="top"] #bar { top: var(--bleed); bottom: auto; left: 0; right: 0; width: auto; height: var(--t); }
    body[data-edge="bottom"] #bar { top: auto; bottom: var(--bleed); left: 0; right: 0; width: auto; height: var(--t); }

    body:hover #bar { background: rgba(232, 236, 239, .2); }

    #fill {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 0;
      background: linear-gradient(180deg, var(--c-cool), var(--c-warm));
      transition: height .12s linear, width .12s linear;
    }

    body[data-axis="h"] #fill {
      top: 0;
      bottom: 0;
      left: 0;
      width: 0;
      height: auto;
      background: linear-gradient(90deg, var(--c-cool), var(--c-warm));
    }

    /* 播放头：填充末端亮线 + 光晕 */
    #head {
      position: absolute;
      left: -60%;
      width: 220%;
      height: 2px;
      border-radius: 2px;
      background: #fff;
      box-shadow: 0 0 8px 1px color-mix(in srgb, var(--c-warm) 55%, transparent),
        0 0 18px 5px color-mix(in srgb, var(--c-accent) 20%, transparent);
      opacity: 0;
      transition: opacity .2s ease, top .12s linear, left .12s linear;
    }

    body[data-axis="h"] #head {
      left: auto;
      top: -60%;
      width: 2px;
      height: 220%;
    }

    body[data-media="1"] #head { opacity: 1; }

    body[data-media="0"] #fill { opacity: .3; }
  </style>
</head>

<body data-axis="v" data-edge="right" data-media="0">
  <div id="hit"></div>
  <div id="bar">
    <div id="fill"></div>
    <div id="head"></div>
  </div>

  <script>
    'use strict';

    var overlay = window.desktopOverlay || {};
    var fill = document.getElementById('fill');
    var head = document.getElementById('head');
    var body = document.body;

    var state = {
      progress: 0, positionSec: 0, durationSec: 0, playing: false, hasMedia: false,
      edge: 'right', thickness: 6, bleed: 2,
      accent: { cool: '#33e6ff', warm: '#ffd070', accent: '#7fd8ff' },
    };
    var dragging = false;
    var dragRatio = 0;
    var clockAt = Date.now();

    var HEX = /^#(?:[0-9a-f]{3}|[0-9a-f]{4}|[0-9a-f]{6}|[0-9a-f]{8})$/i;

    function safeHex(value, fallback) {
      var s = String(value == null ? '' : value).trim();
      return HEX.test(s) ? s : fallback;
    }

    // 主题色来自主窗口的音域方块配色；主进程已经过滤过一轮，这里是 CSS 落点前的第二道
    function applyTheme() {
      var root = document.documentElement.style;
      root.setProperty('--t', state.thickness + 'px');
      root.setProperty('--bleed', state.bleed + 'px');
      root.setProperty('--c-cool', safeHex(state.accent.cool, '#33e6ff'));
      root.setProperty('--c-warm', safeHex(state.accent.warm, '#ffd070'));
      root.setProperty('--c-accent', safeHex(state.accent.accent, '#7fd8ff'));
    }

    function clamp01(n) {
      n = Number(n);
      return Number.isFinite(n) ? Math.min(1, Math.max(0, n)) : 0;
    }

    function clockText(sec) {
      sec = Math.max(0, Math.floor(Number(sec) || 0));
      return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
    }

    function vertical() {
      return state.edge === 'left' || state.edge === 'right';
    }

    // 主进程 500ms 推一次；中间用本地时钟补齐，边缘轨才不会一格一格跳
    function estimatedProgress() {
      if (dragging) return clamp01(dragRatio);
      if (!state.durationSec) return 0;
      var pos = state.positionSec;
      if (state.playing) pos += (Date.now() - clockAt) / 1000;
      return clamp01(pos / state.durationSec);
    }

    function paint() {
      var p = estimatedProgress();
      var pct = (p * 100).toFixed(2) + '%';
      if (vertical()) {
        fill.style.height = pct;
        fill.style.width = '100%';
        head.style.top = 'calc(' + pct + ' - 1px)';
      } else {
        fill.style.width = pct;
        fill.style.height = '100%';
        head.style.left = 'calc(' + pct + ' - 1px)';
      }
    }

    function ratioFromEvent(evt) {
      return vertical()
        ? clamp01(evt.clientY / Math.max(1, window.innerHeight))
        : clamp01(evt.clientX / Math.max(1, window.innerWidth));
    }

    // 命中规则不在这里复制一份：上报指针坐标，由主进程用 railBandHit 判定并决定
    // 本窗口是接管点击还是整体鼠标穿透，避免两端规则漂移。
    function sendSeek(ratio) {
      if (typeof overlay.railSeek !== 'function') return;
      Promise.resolve(overlay.railSeek(ratio)).catch(function () {});
    }

    function reportPointer(x, y) {
      if (typeof overlay.railPointer !== 'function') return;
      var now = Date.now();
      // 60ms 节流：转发态下鼠标移动很密，没必要每个点都跑一趟 IPC
      if (now - lastPointerAt < 60) return;
      lastPointerAt = now;
      Promise.resolve(overlay.railPointer(x, y)).catch(function () {});
    }
    var lastPointerAt = 0;

    function forceCapture(on) {
      if (typeof overlay.railSetCapture !== 'function') return;
      Promise.resolve(overlay.railSetCapture(!!on)).catch(function () {});
    }

    window.addEventListener('pointermove', function (evt) {
      if (dragging) {
        // 拖拽期间强制接管：手指滑出窄条也应继续控制进度
        forceCapture(true);
        dragRatio = ratioFromEvent(evt);
        paint();
        return;
      }
      reportPointer(evt.clientX, evt.clientY);
    });

    window.addEventListener('pointerleave', function () {
      if (!dragging) forceCapture(false);
    });

    body.addEventListener('pointerdown', function (evt) {
      if (!state.hasMedia) return;
      dragging = true;
      forceCapture(true);
      dragRatio = ratioFromEvent(evt);
      // 捕获失败不能让后面的绘制被异常吞掉（贴边小窗上实测会抛）
      try { body.setPointerCapture(evt.pointerId); } catch (e) {}
      paint();
      evt.preventDefault();
    });

    window.addEventListener('pointerup', function (evt) {
      if (!dragging) return;
      dragging = false;
      try { if (body.releasePointerCapture && body.hasPointerCapture(evt.pointerId)) body.releasePointerCapture(evt.pointerId); } catch (e) {}
      dragRatio = ratioFromEvent(evt);
      sendSeek(dragRatio);
      state.positionSec = dragRatio * (state.durationSec || 0);
      clockAt = Date.now();
      paint();
    });

    window.addEventListener('pointercancel', function () {
      dragging = false;
      paint();
    });

    // 滚轮微调：整条边都是推子，5 秒一格
    body.addEventListener('wheel', function (evt) {
      if (!state.hasMedia || !state.durationSec) return;
      evt.preventDefault();
      var step = evt.deltaY < 0 ? 1 : -1;
      var next = clamp01(estimatedProgress() + step * (5 / state.durationSec));
      state.positionSec = next * state.durationSec;
      clockAt = Date.now();
      sendSeek(next);
      paint();
    }, { passive: false });

    if (typeof overlay.onRailState === 'function') {
      overlay.onRailState(function (next) {
        if (!next || typeof next !== 'object') return;
        state = {
          progress: clamp01(next.progress),
          positionSec: Number(next.positionSec) || 0,
          durationSec: Number(next.durationSec) || 0,
          playing: !!next.playing,
          hasMedia: !!next.hasMedia,
          edge: String(next.edge || 'right'),
          thickness: Number(next.thickness) || 6,
          bleed: Math.max(0, Number(next.geo && next.geo.bleed) || 0),
          accent: next.accent && typeof next.accent === 'object' ? next.accent : state.accent,
        };
        // 每次推送都以主进程给的 positionSec 重新对表：本地时钟只补两次推送之间的插值。
        // 早先只在"开始播放/换曲"时对表，elapsed 于是从播放起点一路累加，
        // 实测开两分钟后进度跑到真实位置的两倍（123.4s 的歌画到 246s）。
        clockAt = Date.now();
        applyTheme();
        body.dataset.axis = vertical() ? 'v' : 'h';
        body.dataset.edge = state.edge;
        body.dataset.media = state.hasMedia ? '1' : '0';
        paint();
      });
    }

    setInterval(function () {
      if (state.playing || dragging) paint();
    }, 110);

    applyTheme();
    paint();
  </script>
</body>

</html>
